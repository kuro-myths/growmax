name: Build Godot Web and deploy on Vercel

concurrency:
  group: growmax-godot-web-export
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "web/godot-source/**"
      - ".github/workflows/godot-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Godot 4.4.1 and Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate project and export official Godot Web build
        shell: bash
        run: |
          godot --headless --path web/godot-source --editor --quit
          godot --headless --path web/godot-source --export-release "Web" ../index.html

      - name: Polish official Godot HTML shell for responsive fullscreen
        shell: python
        run: |
          from pathlib import Path
          page = Path("web/index.html")
          html = page.read_text(encoding="utf-8")
          css = """
          html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #86c9ed; }
          body { position: fixed; inset: 0; touch-action: none; }
          #canvas { position: absolute; inset: 0; display: block; width: 100vw; height: 100vh; outline: none; }
          #status { background: linear-gradient(145deg, #15334b, #285c76); font-family: Arial, sans-serif; }
          #status-splash { max-width: min(70vw, 560px); max-height: 55vh; object-fit: contain; }
          #status-progress { accent-color: #74d66d; width: min(60vw, 420px); }
          #status-notice { max-width: min(80vw, 620px); font-family: Arial, sans-serif; }
          """
          html = html.replace("</style>", css + "\\n</style>", 1)
          html = html.replace('content="width=device-width, user-scalable=no, initial-scale=1.0"', 'content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"')
          page.write_text(html, encoding="utf-8")

      - name: Verify export artifacts
        shell: bash
        run: |
          test -s web/index.html
          find web -maxdepth 1 -type f \( -name "*.wasm" -o -name "*.pck" -o -name "*.js" \) -print
          test "$(find web -maxdepth 1 -type f -name "*.wasm" | wc -l)" -ge 1
          test "$(find web -maxdepth 1 -type f -name "*.pck" | wc -l)" -ge 1

      - name: Commit exported game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/index.html web/*.wasm web/*.pck web/*.js web/*.png
          if git diff --cached --quiet; then
            echo "No exported changes"
          else
            git commit -m "Build official Godot Web export"
            git push origin HEAD:main
          fi
